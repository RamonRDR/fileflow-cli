[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fileflow-cli"
version = "0.1.0"
description = "A cautious, cross-platform command-line file organizer."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Ramon Rodriguez" }]
keywords = ["cli", "automation", "file-organization", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.15,<1",
  "rich>=13.7,<16",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.14,<1",
  "build>=1.2,<2",
]

[project.scripts]
fileflow = "fileflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fileflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
