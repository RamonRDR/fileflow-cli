name: One-time cleanup of README badge branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'RamonRDR/fileflow-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify completed PR and delete its unchanged head branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=7
          branch="docs/readme-badges"
          merged="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.merged')"
          if [[ "$merged" != "true" ]]; then
            echo "::error::PR #$pr is not merged; refuse branch deletion"
            exit 1
          fi
          expected="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.head.sha')"
          actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Branch $branch moved since PR merge; refuse deletion"
            exit 1
          fi
          branch_tree="$(gh api "repos/$GH_REPO/git/commits/$actual" --jq '.tree.sha')"
          main_tree="$(gh api "repos/$GH_REPO/git/commits/$GITHUB_SHA" --jq '.tree.sha')"
          if [[ "$branch_tree" != "$main_tree" ]]; then
            echo "::error::Maintenance branch differs from merged main; refuse deletion"
            exit 1
          fi
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" > /dev/null
          echo "Removed merged README badge branch: $branch"
