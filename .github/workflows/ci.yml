name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff formatting
        run: ruff format --check .

      - name: Pytest
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Install and verify built wheel
        run: python examples/wheel_smoke.py

      - name: CLI help smoke test
        run: |
          python -m fileflow --help
          fileflow organize --help
          fileflow undo --help

      - name: Demo CLI end-to-end
        run: python examples/demo.py
